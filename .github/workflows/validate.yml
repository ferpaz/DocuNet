name: Validate DocuNet

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
          cache: true
          cache-dependency-path: src/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --results-directory ../tests/results/ci --coverage --coverage-settings coverage.config --coverage-output-format cobertura --coverage-output "${{ github.workspace }}/tests/results/ci/coverage.cobertura.xml"
      - name: Check coverage thresholds
        shell: pwsh
        run: ./Check-Coverage.ps1 -Report ../tests/results/ci/coverage.cobertura.xml
      - run: dotnet run --no-build --configuration Release --project DocuNet.Cli -- --output=../tests/results/ci/site tests/DocuNet.TestFixtures/bin/Release/net10.0/DocuNet.TestFixtures.dll
